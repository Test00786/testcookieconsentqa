<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consent Management Demo</title>

<link rel="stylesheet" href="styles.css">

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
}

.container{
    width:450px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#0066cc;
    color:#fff;
    border:none;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
}

button:hover{
    background:#0055aa;
}

#dashboard{
    display:none;
}

#consentContainer{
    margin-top:20px;
}

.logout{
    background:#d9534f;
}

.logout:hover{
    background:#c9302c;
}

#consent-root{
    margin-top:20px;
}

#error-message{
    color:red;
}
</style>

</head>

<body>

<!---------------- LOGIN ------------------>

<div class="container" id="loginPage">

<h2>Login</h2>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<button type="button" onclick="login()">
Login
</button>

</div>

<!---------------- DASHBOARD ------------------>

<script>
function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Enter Email and Password");
        return;
    }

    // Dummy login for testing only.
    localStorage.setItem("email", email);
    localStorage.setItem("loggedIn", "true");

    // Open the second page in the same browser tab.
    window.location.href = "index2.html";
}
</script>

</body>
</html>
